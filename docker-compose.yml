name: fynixcyberaudit

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: fynixcyberaudit
      MYSQL_USER: fynixcyberaudit
      MYSQL_PASSWORD: fynixcyberaudit
    volumes:
      - fynixcyberaudit_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: fynixcyberaudit
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8082:80"
    environment:
      APP_NAME: Fynix Cyber Audit
      APP_ENV: local
      APP_DEBUG: "true"
      APP_KEY: ${APP_KEY:-}
      APP_URL: http://localhost:8082

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: fynixcyberaudit
      DB_USERNAME: fynixcyberaudit
      DB_PASSWORD: fynixcyberaudit

      ADMIN_EMAIL: admin@campass.cm
      ADMIN_PASSWORD: "fynixdemo123!"

      CACHE_DRIVER: file
      SESSION_DRIVER: file
      QUEUE_CONNECTION: sync

      MAIL_MAILER: log

volumes:
  fynixcyberaudit_db:
