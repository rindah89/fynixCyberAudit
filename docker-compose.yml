name: fynixcyberaudit

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${DB_DATABASE:-fynixcyberaudit}
      MYSQL_USER: ${DB_USERNAME:-fynixcyberaudit}
      MYSQL_PASSWORD: ${DB_PASSWORD:-fynixcyberaudit}
    volumes:
      - fynixcyberaudit_db:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: .
    image: fynixcyberaudit
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8082}:80"
    environment:
      APP_NAME: ${APP_NAME:-Fynix Cyber Audit}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost:8082}
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TIMEOUT_SECONDS: ${SENTRY_TIMEOUT_SECONDS:-2}

      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: ${DB_HOST:-db}
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-fynixcyberaudit}
      DB_USERNAME: ${DB_USERNAME:-fynixcyberaudit}
      DB_PASSWORD: ${DB_PASSWORD:-fynixcyberaudit}

      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      CACHE_DRIVER: ${CACHE_DRIVER:-file}
      SESSION_DRIVER: ${SESSION_DRIVER:-file}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-database}

      MAIL_MAILER: ${MAIL_MAILER:-log}

      OIDC_ENABLED: ${OIDC_ENABLED:-false}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_AUTHORIZE_ENDPOINT: ${OIDC_AUTHORIZE_ENDPOINT:-}
      OIDC_TOKEN_ENDPOINT: ${OIDC_TOKEN_ENDPOINT:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_AUTO_PROVISION: ${OIDC_AUTO_PROVISION:-true}
      OIDC_ENFORCE_SSO_ONLY: ${OIDC_ENFORCE_SSO_ONLY:-false}
      OIDC_DEFAULT_ROLE: ${OIDC_DEFAULT_ROLE:-Regular User}

      SUITE_ITSM_ENABLED: ${SUITE_ITSM_ENABLED:-false}
      SUITE_ITSM_BASE_URL: ${SUITE_ITSM_BASE_URL:-}
      SUITE_ITSM_API_TOKEN: ${SUITE_ITSM_API_TOKEN:-}
      SUITE_ITSM_COMPANY_ID: ${SUITE_ITSM_COMPANY_ID:-}
      SUITE_ITSM_ORIGIN_ID: ${SUITE_ITSM_ORIGIN_ID:-}
      SUITE_ITSM_TICKET_TYPE_ID: ${SUITE_ITSM_TICKET_TYPE_ID:-}
      SUITE_ITSM_DEPARTMENT_ID: ${SUITE_ITSM_DEPARTMENT_ID:-}
      SUITE_ITSM_PRIORITY_ID: ${SUITE_ITSM_PRIORITY_ID:-}
      SUITE_ITSM_SYNC_ANALYST_ID: ${SUITE_ITSM_SYNC_ANALYST_ID:-}
      SUITE_ITSM_REQUESTER_EMAIL: ${SUITE_ITSM_REQUESTER_EMAIL:-grc-integration@example.invalid}
      SUITE_ITSM_PUBLIC_URL: ${SUITE_ITSM_PUBLIC_URL:-}
      SUITE_GRC_PUBLIC_URL: ${SUITE_GRC_PUBLIC_URL:-}
      SUITE_ITSM_WEBHOOK_ID: ${SUITE_ITSM_WEBHOOK_ID:-}
      SUITE_ITSM_WEBHOOK_SECRET: ${SUITE_ITSM_WEBHOOK_SECRET:-}
      SUITE_LOCAL_TENANT_ID: ${SUITE_LOCAL_TENANT_ID:-}
      SUITE_ITSM_REMOTE_TENANT_ID: ${SUITE_ITSM_REMOTE_TENANT_ID:-}

  worker:
    build: .
    image: fynixcyberaudit
    restart: unless-stopped
    command: php artisan queue:work --sleep=2 --tries=6 --timeout=300 --max-time=3600
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'artisan queue:work' >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 4

volumes:
  fynixcyberaudit_db:
